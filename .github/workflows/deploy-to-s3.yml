name: Deploy Portfolio to AWS S3

on:
  push:
    branches:
      - main
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Deploy website to S3
        run: |
          aws s3 cp index.html s3://ashwanth-s3-static-website-2026/index.html --content-type text/html
          aws s3 cp style.css s3://ashwanth-s3-static-website-2026/style.css --content-type text/css
